name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  paper:
    name: Build manuscript (RITA template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with TeX Live
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Upload paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: main.pdf
          if-no-files-found: error

  references:
    name: Verify bibliography integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify references (offline)
        run: python tools/verify-refs.py
      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: reference-verification
          path: |
            refs/verified.csv
            lit/matrix.csv

  secret-scan:
    name: Confidentiality and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run guard-secrets
        shell: pwsh
        run: ./tools/guard-secrets.ps1

  artifact-tests:
    name: Artifact tests (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether artifact exists
        id: check
        run: |
          if [ -f artifact/pom.xml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        if: steps.check.outputs.present == 'true'
        working-directory: artifact
        run: mvn -B -ntp test
