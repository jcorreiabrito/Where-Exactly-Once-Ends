# WXEO campaign stack -- Linux/container host (the approved campaign substrate).
#
# Services (all on 127.0.0.1 of the host, same ports the frozen runner/artifact expect):
#   kafka-1..3   PLAINTEXT 9091/9092/9093   RF=3, min.insync=2, KRaft static quorum
#   postgres     5433                        database `wxeo`, roles wxeo_app/wxeo_read/wxeo_fault
#   toxiproxy    8474                        proxies 19092/19093/19094 (kafka) and 15433 (db)
#
# The runner resets the stack with `docker compose down -v && up -d --wait`, which is the clean
# equivalent of the Windows `reset-kafka` verb (fresh broker log dirs, fresh PG data volume).
#
# Versions are pinned to the frozen campaign versions where the image tag exists; the runbook
# records the actual versions read back from the live services (`--wxeo` tools print them).
name: wxeo-campaign

x-kafka-common: &kafka-common
  image: apache/kafka:3.7.2
  restart: unless-stopped
  environment: &kafka-env
    CLUSTER_ID: wxeo-campaign-kraft-0001
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9192,2@kafka-2:9193,3@kafka-3:9194
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    KAFKA_MIN_INSYNC_REPLICAS: "2"
    KAFKA_NUM_PARTITIONS: "3"
    KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_DELETE_TOPIC_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    # Disk accounting: the Windows run needed a 1 MiB Kafka index cap (see A3/M9); keeping the same
    # setting on Linux makes the two environments comparable and keeps per-run growth ~12 MB.
    KAFKA_LOG_SEGMENT_BYTES: "67108864"
    KAFKA_LOG_INDEX_SIZE_MAX_BYTES: "1048576"
    KAFKA_LOG_INDEX_INTERVAL_BYTES: "1048576"
    KAFKA_LOG_RETENTION_HOURS: "2"
    KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "3600000"
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 20s

services:
  kafka-1:
    <<: *kafka-common
    ports:
      - "9091:9091"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9192,EXTERNAL://0.0.0.0:9091
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://127.0.0.1:9091
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9193,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://127.0.0.1:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9194,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://127.0.0.1:9093
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: wxeo
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--auth-host=trust --auth-local=trust"
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-wxeo-initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wxeo"]
      interval: 3s
      timeout: 5s
      retries: 40

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["-host", "0.0.0.0", "-port", "8474", "-config", "/config/toxiproxy.json"]
    ports:
      - "8474:8474"
      - "19092:19092"
      - "19093:19093"
      - "19094:19094"
      - "15433:15433"
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  pg-data:
