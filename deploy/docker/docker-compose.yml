# WXEO campaign stack -- Linux/container host with fault-routing substrate (S3 redesign).
#
# Topology (see docs/LINUX-CAMPAIGN-RUNBOOK.md section 3):
#   kafka-1..3   KRaft combined broker+controller.
#                INTERNAL listener 29095 (broker<->broker, advertised kafka-N:29095)
#                CONTROLLER 9192/9193/9194 (quorum unchanged)
#                EXTERNAL listener 29091/29092/29093 (client-facing; advertised 127.0.0.1:19091..19093)
#                Host-published DIRECT compat ports 127.0.0.1:9091..9093 -> EXTERNAL 29091..29093
#                (bootstrap/admin only: every advertised broker address is a Toxiproxy port, so all
#                client<->broker traffic after metadata goes through Toxiproxy).
#   postgres    5433 (loopback only), db `wxeo`, roles wxeo_app/wxeo_read/wxeo_fault, trust loopback
#   toxiproxy   8474 API + proxies kafka-1..3 (19091..19093) and db (15433). The old bootstrap alias
#               19094 was removed after the runner switched every Kafka endpoint to a group member
#               (A6/B7 follow-up: deploy/docker/endpoints.json kafka.fault_bootstrap=127.0.0.1:19091).
#
# Every published port is bound to 127.0.0.1 (A4/runbook isolation claim, red-team L6).
# The runner resets the stack with `docker compose down -v && up -d --wait` (fresh broker log dirs,
# fresh PG volume); `delete.topic.enable=false` stays set as a safety net (deletion is unnecessary:
# each run uses unique topics and the volume reset reclaims them).
#
# Container names are pinned so the F1/F2 injectors (experiments/stack.py) can address them
# deterministically: wxeo-campaign-kafka-1/2/3, wxeo-campaign-postgres, wxeo-campaign-toxiproxy.
name: wxeo-campaign

x-kafka-common: &kafka-common
  image: apache/kafka:3.7.2
  restart: unless-stopped
  environment: &kafka-env
    CLUSTER_ID: wxeo-campaign-kraft-0001
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9192,2@kafka-2:9193,3@kafka-3:9194
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    KAFKA_MIN_INSYNC_REPLICAS: "2"
    KAFKA_NUM_PARTITIONS: "3"
    KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # Safety net only; the campaign never deletes topics (unique topic per run + volume reset).
    KAFKA_DELETE_TOPIC_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    # Disk accounting parity with the Windows/native stack (A3/M9): 1 MiB index caps, 2 h retention.
    KAFKA_LOG_SEGMENT_BYTES: "67108864"
    KAFKA_LOG_INDEX_SIZE_MAX_BYTES: "1048576"
    KAFKA_LOG_INDEX_INTERVAL_BYTES: "1048576"
    KAFKA_LOG_RETENTION_HOURS: "2"
    KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "3600000"
  healthcheck:
    # healthcheck uses the INTERNAL listener (broker-local, never client-facing)
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29095 >/dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 20s

services:
  kafka-1:
    <<: *kafka-common
    container_name: wxeo-campaign-kafka-1
    ports:
      - "127.0.0.1:9091:29091"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29095,CONTROLLER://0.0.0.0:9192,EXTERNAL://0.0.0.0:29091
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29095,EXTERNAL://127.0.0.1:19091
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: wxeo-campaign-kafka-2
    ports:
      - "127.0.0.1:9092:29092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29095,CONTROLLER://0.0.0.0:9193,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29095,EXTERNAL://127.0.0.1:19092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: wxeo-campaign-kafka-3
    ports:
      - "127.0.0.1:9093:29093"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29095,CONTROLLER://0.0.0.0:9194,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29095,EXTERNAL://127.0.0.1:19093
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  postgres:
    image: postgres:16
    container_name: wxeo-campaign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wxeo
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--auth-host=trust --auth-local=trust"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-wxeo-initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wxeo"]
      interval: 3s
      timeout: 5s
      retries: 40

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: wxeo-campaign-toxiproxy
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["-host", "0.0.0.0", "-port", "8474", "-config", "/config/toxiproxy.json"]
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:19091:19091"
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19093:19093"
      - "127.0.0.1:15433:15433"
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    healthcheck:
      test: ["CMD-SHELL", "toxiproxy-cli list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  pg-data:
